[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Fork: Ethereum mainnet, pinned block 26425790 (2026-11-16 ~06:29 UTC).
# The fork is pinned in code (test setUp calls vm.createSelectFork with the
# block number), so plain `forge test` reproduces the result from a clean clone.
# Optional: MAINNET_RPC_URL=<your RPC> forge test
# Run: forge test -vvv
